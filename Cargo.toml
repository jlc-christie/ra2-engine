[package]
name = "ra2-rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/ra2-formats", "crates/ra2-sim", "crates/ra2-tools", "crates/ra2-net", "crates/ra2-server", "crates/ra2-bundle"]

# Bevy systems take their data as parameters and queries.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[lints]
workspace = true

[dependencies]
ra2-formats = { path = "crates/ra2-formats" }
ra2-sim = { path = "crates/ra2-sim" }
ra2-net = { path = "crates/ra2-net" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
bevy = { version = "0.20", features = ["wav"] }
rfd = "0.17"
libc = "0.2"

# Small optimizations for our own code, full optimizations for dependencies (Bevy is very slow at opt-level 0)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Drawing the icon is slow unoptimised.
[profile.dev.package.ra2-bundle]
opt-level = 3

# What `ra2-bundle` builds for players: as release, without the symbols
# (which more than double the program's size).
[profile.dist]
inherits = "release"
strip = true
